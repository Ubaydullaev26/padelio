name: padelio

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: padelio
      POSTGRES_PASSWORD: padelio
      POSTGRES_DB: padelio
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U padelio -d padelio']
      interval: 3s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
